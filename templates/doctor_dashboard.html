<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - CareQueue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/doctor_dashboard.css') }}">
</head>

<body>

    <div class="header">
        <h2 id="clinicName"></h2>
        <p id="statusText"></p>
    </div>

    <div class="card">

        <div class="info-block">
            <p>Doctor</p>
            <h3 id="doctorName"></h3>
        </div>

        <div class="info-block">
            <p>OPD Timing</p>
            <h4 id="opdTiming"></h4>
        </div>

        <div class="info-row">
            <div>
                <p>Current Token</p>
                <h1 id="currentToken">0</h1>
            </div>

            <div>
                <p>Patients Waiting</p>
                <h1 id="waitingCount">0</h1>
            </div>
        </div>

        <div class="info-block avg-time">
            <p>Avg. Consultation Time</p>
            <h4 id="avgTime">~5 min</h4>
        </div>

        <button class="btn-primary" onclick="markDone()">✓ Mark as Done</button>
        <button class="btn-open" id="openBtn" onclick="openOPD()">Open OPD</button>
        <button class="btn-pause" onclick="pauseOPD()">⏸ Pause</button>
        <button class="btn-resume" onclick="resumeOPD()">▶ Resume</button>
        <button class="btn-close" onclick="closeClinic()">✕ Close Clinic</button>
        <button class="btn-reset" onclick="resetQueue()">↻ Reset Queue</button>
        <hr style="margin: 12px 0; border: none; border-top: 1px solid #eee;">
        <button class="btn-delete" onclick="deleteClinic()">🗑 Delete Clinic</button>

    </div>

    <!-- Waiting List -->
    <div class="card waiting-card">
        <h3>Waiting List</h3>
        <div id="waitingList">
            <p class="empty-msg">No patients waiting</p>
        </div>
    </div>

    <!-- Clinic Location Settings -->
    <div class="card" id="locationCard" style="margin-top:16px">
        <h3 style="margin-bottom:12px">📍 Clinic Location Settings</h3>
        <div style="margin-bottom:10px">
            <label style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:4px">Clinic Address</label>
            <input id="locInput" type="text" placeholder="e.g. Satellite Road, Ahmedabad"
                style="width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none">
        </div>
        <div style="margin-bottom:12px">
            <label style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:4px">Google Maps Link <span style="font-weight:400;color:#94a3b8">(optional — paste share link)</span></label>
            <input id="mapsInput" type="url" placeholder="https://maps.google.com/?q=..."
                style="width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;box-sizing:border-box;outline:none">
            <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">Open Google Maps → search your clinic → Share → Copy link</p>
        </div>
        <div style="display:flex;gap:10px">
            <button onclick="saveLocation()" style="flex:1;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">Save Location</button>
            <button onclick="previewMaps()" id="previewBtn" style="flex:1;padding:10px;background:#f1f5f9;color:#2563eb;border:1.5px solid #2563eb;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">🧭 Preview</button>
        </div>
        <p id="locMsg" style="font-size:13px;margin-top:8px;color:#059669;display:none">✅ Location saved! Patients can now navigate to your clinic.</p>
    </div>

    <script>
        const doctorId = localStorage.getItem("doctorId");

        if (!doctorId) {
            window.location.href = "/doctor_login";
        }

        // ── Fetch dashboard data ──────────────────────────────────────────────
        async function loadDashboard() {
            try {
                const res = await fetch(`/api/doctor/dashboard/${doctorId}`);
                if (!res.ok) throw new Error('Failed to load dashboard');
                const data = await res.json();

                // Update header
                document.getElementById("clinicName").innerText = data.clinic.name;
                document.getElementById("statusText").innerText = "Status: " + data.status;

                // Update info
                document.getElementById("doctorName").innerText = data.doctor.name;
                document.getElementById("opdTiming").innerText =
                    data.opd_start_time + " - " + data.opd_end_time;
                document.getElementById("currentToken").innerText =
                    data.current_token_number || 0;
                document.getElementById("waitingCount").innerText =
                    data.waiting_count || 0;
                document.getElementById("avgTime").innerText =
                    "~" + data.average_consultation_time + " min";

                // Update status styling
                const header = document.querySelector('.header');
                header.className = 'header';
                if (data.status === 'Open') header.classList.add('status-open');
                else if (data.status === 'Break') header.classList.add('status-break');
                else header.classList.add('status-closed');

                // Update waiting list (token numbers only, no patient names)
                const listEl = document.getElementById("waitingList");
                if (data.waiting_tokens && data.waiting_tokens.length > 0) {
                    listEl.innerHTML = data.waiting_tokens.map(num =>
                        `<div class="token-item">Token #${num}</div>`
                    ).join('');
                } else {
                    listEl.innerHTML = '<p class="empty-msg">No patients waiting</p>';
                }

            } catch (err) {
                console.error("Dashboard load error:", err);
            }
        }

        // ── Doctor Actions ────────────────────────────────────────────────────

        async function markDone() {
            try {
                const res = await fetch('/api/doctor/mark_done', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doctor_id: parseInt(doctorId) })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || data.message || "Cannot mark done");
                    return;
                }

                loadDashboard();
            } catch (err) {
                console.error("Mark done error:", err);
                alert("Could not connect to server");
            }
        }

        async function openOPD() {
            await updateStatus("Open");
        }

        async function pauseOPD() {
            await updateStatus("Break");
        }

        async function resumeOPD() {
            await updateStatus("Open");
        }

        async function closeClinic() {
            await updateStatus("Closed");
        }

        async function updateStatus(status) {
            try {
                const res = await fetch('/api/doctor/update_status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        doctor_id: parseInt(doctorId),
                        status: status
                    })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || data.error || "Cannot update status");
                    return;
                }

                loadDashboard();
            } catch (err) {
                console.error("Status update error:", err);
                alert("Could not connect to server");
            }
        }

        async function resetQueue() {
            if (!confirm("Are you sure you want to reset the queue?")) return;

            try {
                const res = await fetch('/api/doctor/reset_queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doctor_id: parseInt(doctorId) })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || data.error || "Cannot reset queue");
                    return;
                }

                alert("Queue reset successfully");
                loadDashboard();
            } catch (err) {
                console.error("Reset error:", err);
                alert("Could not connect to server");
            }
        }

        async function deleteClinic() {
            if (!confirm("Are you sure you want to DELETE your clinic? This will remove your clinic from the system and cancel all waiting patients. This action cannot be undone.")) return;

            try {
                const res = await fetch('/api/doctor/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doctor_id: parseInt(doctorId) })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || data.error || "Cannot delete clinic");
                    return;
                }

                // Clear local storage and redirect
                localStorage.removeItem("doctorId");
                localStorage.removeItem("doctorApiKey");
                localStorage.removeItem("loggedDoctor");
                alert("Clinic deleted successfully.");
                window.location.href = "/";
            } catch (err) {
                console.error("Delete error:", err);
                alert("Could not connect to server");
            }
        }

        // ── Location Settings ─────────────────────────────────────────────────
        async function loadLocation() {
            try {
                const res = await fetch(`/api/doctor/dashboard/${doctorId}`);
                const data = await res.json();
                if (data.clinic) {
                    const loc = data.clinic.location || '';
                    const link = data.clinic.maps_link || '';
                    document.getElementById('locInput').value = loc;
                    document.getElementById('mapsInput').value = link;
                }
            } catch(e) { console.error('Location load error:', e); }
        }

        async function saveLocation() {
            const location  = document.getElementById('locInput').value.trim();
            const maps_link = document.getElementById('mapsInput').value.trim();
            const msg       = document.getElementById('locMsg');

            if (!location) { alert('Please enter a clinic address.'); return; }

            try {
                const res = await fetch('/api/clinic/update_location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ doctor_id: parseInt(doctorId), location, maps_link })
                });
                const data = await res.json();
                if (!res.ok) { alert(data.error || 'Could not save location'); return; }
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 4000);
            } catch(e) {
                alert('Could not connect to server');
            }
        }

        function previewMaps() {
            const link = document.getElementById('mapsInput').value.trim();
            const loc  = document.getElementById('locInput').value.trim();
            const url  = link || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`;
            if (!loc && !link) { alert('Enter an address or Maps link first.'); return; }
            window.open(url, '_blank');
        }

        // ── Init & Auto-refresh ───────────────────────────────────────────────
        loadDashboard();
        loadLocation();
        setInterval(loadDashboard, 10000); // Refresh every 10 seconds
    </script>

</body>

</html>
