<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareQueue - Select Role</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_login.css') }}">
    <style>
        .role-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            font-family: var(--font);
            font-size: 1.05rem;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text-h);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 16px;
        }

        .role-btn:hover {
            border-color: var(--brand-mid);
            background: var(--surface-1);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .role-btn.doctor {
            border-color: transparent;
            background: linear-gradient(135deg, hsl(140, 60%, 45%), hsl(140, 70%, 35%));
            color: white;
            box-shadow: 0 4px 14px hsl(140, 60%, 45%, 0.35);
        }

        .role-btn.doctor:hover {
            background: linear-gradient(135deg, hsl(140, 60%, 40%), hsl(140, 70%, 30%));
            box-shadow: 0 6px 18px hsl(140, 60%, 45%, 0.45);
        }

        .role-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .role-btn.doctor svg {
            stroke: currentColor;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <!-- Left decorative panel -->
        <div class="brand-panel" aria-hidden="true">
            <div class="brand-panel__inner">
                <div class="brand-logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="10" fill="rgba(255,255,255,0.15)"/>
                        <path d="M20 8v24M8 20h24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                    <span>CareQueue</span>
                </div>
                <h2 class="brand-tagline">Healthcare made<br>seamless.</h2>
                <ul class="brand-features">
                    <li>
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.2)"/><path d="M7 12l3.5 3.5L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        One system, two portals
                    </li>
                    <li>
                        <svg width="18" height="18" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.2)"/><path d="M7 12l3.5 3.5L17 8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Modern OPD management
                    </li>
                </ul>
            </div>
        </div>

        <!-- Right form panel -->
        <div class="form-panel">
            <div class="form-card">
                <!-- Mobile logo -->
                <div class="mobile-logo" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="10" fill="#4f7cf7"/>
                        <path d="M20 8v24M8 20h24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                    <span>CareQueue</span>
                </div>

                <div class="step active">
                    <div class="step-header">
                        <h1>Welcome</h1>
                        <p class="step-sub">Please select your portal to continue.</p>
                    </div>

                    <button class="role-btn" onclick="goPatient()">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        Patient Portal
                    </button>
                    
                    <button class="role-btn doctor" onclick="goDoctor()">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                        Doctor Portal
                    </button>

                    <footer class="card-footer" style="margin-top: 30px;">
                        © CareQueue 2026 &nbsp;·&nbsp; All Rights Reserved
                    </footer>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function goPatient() {
            window.location.href = "/patient_login";
        }
        function goDoctor() {
            window.location.href = "/doctor_login";
        }
    </script>
</body>
</html>
