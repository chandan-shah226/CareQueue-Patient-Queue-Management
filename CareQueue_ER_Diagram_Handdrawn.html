<!DOCTYPE html>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f2ede3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 50px;
      font-family: 'Caveat', cursive;
    }

    .page-title {
      font-family: 'Caveat', cursive;
      font-size: 2.6rem;
      font-weight: 700;
      color: #111;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-align: center;
    }

    .page-sub {
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 26px;
      text-align: center;
    }

    .paper {
      background: #fffef8;
      border: 1px solid #bbb;
      box-shadow: 
        3px 3px 0 #d0c8b0,
        6px 6px 0 #c0b8a0,
        0 10px 40px rgba(0,0,0,0.18);
      max-width: 1420px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Ruled lines effect */
    .paper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 38px,
        #dde4f0 38px,
        #dde4f0 39px
      );
      pointer-events: none;
      opacity: 0.5;
    }

    /* Left margin red line */
    .paper::after {
      content: '';
      position: absolute;
      top: 0; left: 68px; bottom: 0;
      width: 1.5px;
      background: rgba(220, 100, 100, 0.35);
      pointer-events: none;
    }

    svg.diagram {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<div class="page-title">CareQueue — Entity Relationship Diagram</div>
<p class="page-sub">Chen Notation &nbsp;·&nbsp; Black &amp; White &nbsp;·&nbsp; Hand-Drawn Style</p>

<div class="paper">
<svg class="diagram" viewBox="0 0 1400 1020" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Slight hand-drawn wobble -->
  <filter id="wobble" x="-3%" y="-3%" width="106%" height="106%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>

  <!-- Pencil texture on shapes -->
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="grey"/>
    <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend"/>
    <feComposite in="blend" in2="SourceGraphic" operator="in"/>
  </filter>

  <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M0,0.5 L0,5.5 L6,3 z" fill="#222"/>
  </marker>
</defs>
